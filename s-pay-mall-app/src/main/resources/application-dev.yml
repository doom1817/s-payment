server:
  port: 8080
  tomcat:
    max-connections: 20
    threads:
      max: 20
      min-spare: 10
    accept-count: 10

#应用配置
app:
  config:
    api-version: v1
    #跨域: 开发阶段设置不限制
    cross-origin: "*"
    #sc渠道
    group-buy-market:
      api-url: http://localhost:8091
      notify-url: http://localhost:8080/api/v1/alipay/group_buy_notify
      source: s01
      channel: c01

spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/s-pay-mall?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialSize: 5
    minIdle: 5
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    filters: stat
  rabbitmq:
    host: 192.168.6.135
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1 # 每个消费者的并发线程数
    template:
      delvery-mode: persistent # 消息持久化
    config:
      #消费者
      consumer:
        #交换机
        exchange: group_buy_market_exchange
        #消息主题配置：路由Key、队列
        topic_team_success:
          #消息主题
          routing-key: topic.team_success
          # 消息队列
          queue: s_pay_mall_queue_2_topic_team_success
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# Redis
redis:
  sdk:
    config:
      host: localhost
      port: 6379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

# 支付宝支付 - 沙箱 https://opendocs.alipay.com/common/02kkv7
